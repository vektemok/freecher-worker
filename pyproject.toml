[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arny-worker"
version = "0.1.1"
description = "Local worker for automated video highlight extraction and clipping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
arny-worker = "arny_worker.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
